<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <title>សួស្តីឆ្នាំថ្មី ២០២៦ 🎆</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Khmer Font -->
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Kantumruy Pro', sans-serif;
      overflow: hidden;
      background: radial-gradient(circle at top, #1f2937, #020617);
    }
    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .count {
      animation: pop 0.4s ease-in-out;
    }
    @keyframes pop {
      0% { transform: scale(1.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="text-white">

  <!-- 🎇 Fireworks -->
  <canvas id="fireworks"></canvas>

  <!-- 🌟 Content -->
  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center text-center px-6">

    <h1 class="text-4xl md:text-6xl font-bold mb-4 animate-pulse">
      🎉 សួស្តីឆ្នាំថ្មី ២០២៦ 🎉
    </h1>

    <p class="text-gray-400 mb-10 text-lg">
      រាប់ថយក្រោយចូលឆ្នាំថ្មី✨
    </p>

    <!-- Countdown -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-xl">
      <div class="bg-white/5 backdrop-blur rounded-2xl p-6 shadow-xl">
        <h2 id="days" class="text-4xl font-bold count">00</h2>
        <p class="text-gray-400 text-sm mt-1">ថ្ងៃ</p>
      </div>
      <div class="bg-white/5 backdrop-blur rounded-2xl p-6 shadow-xl">
        <h2 id="hours" class="text-4xl font-bold count">00</h2>
        <p class="text-gray-400 text-sm mt-1">ម៉ោង</p>
      </div>
      <div class="bg-white/5 backdrop-blur rounded-2xl p-6 shadow-xl">
        <h2 id="minutes" class="text-4xl font-bold count">00</h2>
        <p class="text-gray-400 text-sm mt-1">នាទី</p>
      </div>
      <div class="bg-white/5 backdrop-blur rounded-2xl p-6 shadow-xl">
        <h2 id="seconds" class="text-4xl font-bold count">00</h2>
        <p class="text-gray-400 text-sm mt-1">វិនាទី</p>
      </div>
    </div>

    <!-- <button onclick="playMusic()" class="mt-10 px-8 py-3 bg-indigo-600 hover:bg-indigo-700 rounded-full shadow-lg transition">
      ▶️ ចាក់តន្ត្រី
    </button> -->

    <p class="mt-6 text-gray-400 text-sm">
      សូមឲ្យឆ្នាំ ២០២៦ នាំមកនូវសុខភាពល្អ សំណាងល្អ និងជោគជ័យ 🌟
    </p>
  </div>

  <!-- 🎵 Music -->
  <!-- <audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2022/12/14/audio_12b5f3e9b1.mp3" type="audio/mpeg">
  </audio> -->

  <script>
    /* 🎵 Music */
    function playMusic() {
      music.play();
    }

    /* 🕛 Countdown Animation */
    const target = new Date("January 1, 2026 00:00:00").getTime();
    const ids = ["days", "hours", "minutes", "seconds"];

    function updateCountdown() {
      const now = Date.now();
      const diff = target - now;
      if (diff <= 0) return;

      const values = [
        Math.floor(diff / (1000*60*60*24)),
        Math.floor((diff / (1000*60*60)) % 24),
        Math.floor((diff / (1000*60)) % 60),
        Math.floor((diff / 1000) % 60)
      ];

      ids.forEach((id, i) => {
        const el = document.getElementById(id);
        const val = values[i].toString().padStart(2,"0");
        if (el.textContent !== val) {
          el.textContent = val;
          el.classList.remove("count");
          void el.offsetWidth;
          el.classList.add("count");
        }
      });
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    /* 🎇 Fireworks (Dark Theme Friendly) */
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    canvas.width = innerWidth;
    canvas.height = innerHeight;

    let particles = [];

    function launchFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.5;
      const colors = ["#38bdf8","#a78bfa","#f472b6","#22c55e","#fde047"];

      for (let i = 0; i < 140; i++) {
        particles.push({
          x, y,
          vx: (Math.random()-0.5)*9,
          vy: (Math.random()-0.5)*9,
          life: 110,
          color: colors[Math.floor(Math.random()*colors.length)]
        });
      }
    }

    function animateFireworks() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach((p,i)=>{
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x,p.y,3,3);
        if(p.life<=0) particles.splice(i,1);
      });
      requestAnimationFrame(animateFireworks);
    }

    setInterval(launchFirework, 350);
    animateFireworks();

    onresize = () => {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
  </script>

</body>
</html>
